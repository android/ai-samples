swagger: '2.0'
info:
  title: JetPacker API Gateway
  description: API Gateway for JetPacker
  version: 1.0.0
schemes:
  - https

securityDefinitions:
  firebase:
    authorizationUrl: ""
    flow: "implicit"
    type: "oauth2"
    x-google-issuer: "https://securetoken.google.com/YOUR_FIREBASE_PROJECT_ID"
    x-google-jwks_uri: "https://www.googleapis.com/service_accounts/v1/metadata/x509/securetoken@system.gserviceaccount.com"
    x-google-audiences: "YOUR_FIREBASE_PROJECT_ID"

security:
  - firebase: []

paths:
  /orchestrate:
    post:
      summary: Orchestrate
      operationId: orchestrate
      x-google-backend:
        address: https://YOUR_CLOUD_RUN_SERVICE_URL/orchestrate
        deadline: 300.0
      responses:
        '200':
          description: OK
  /stream:
    get:
      summary: Stream
      operationId: stream
      x-google-backend:
        address: https://YOUR_CLOUD_RUN_SERVICE_URL/stream
        deadline: 300.0
      responses:
        '200':
          description: OK
  /respond:
    post:
      summary: Respond
      operationId: respond
      x-google-backend:
        address: https://YOUR_CLOUD_RUN_SERVICE_URL/respond
        deadline: 300.0
      responses:
        '200':
          description: OK
  /status_stream:
    post:
      summary: Status Stream
      operationId: status_stream
      x-google-backend:
        address: https://YOUR_CLOUD_RUN_SERVICE_URL/status_stream
        deadline: 300.0
      responses:
        '200':
          description: OK
  /v2/orchestrate:
    post:
      summary: Orchestrate V2
      operationId: orchestrate_v2
      x-google-backend:
        address: https://YOUR_CLOUD_RUN_SERVICE_URL/v2/orchestrate
        deadline: 300.0
      responses:
        '200':
          description: OK
  /v2/stream:
    get:
      summary: Stream V2
      operationId: stream_v2
      x-google-backend:
        address: https://YOUR_CLOUD_RUN_SERVICE_URL/v2/stream
        deadline: 300.0
      responses:
        '200':
          description: OK
  /v2/respond:
    post:
      summary: Respond V2
      operationId: respond_v2
      x-google-backend:
        address: https://YOUR_CLOUD_RUN_SERVICE_URL/v2/respond
        deadline: 300.0
      responses:
        '200':
          description: OK
  /v2/status_stream:
    post:
      summary: Status Stream V2
      operationId: status_stream_v2
      x-google-backend:
        address: https://YOUR_CLOUD_RUN_SERVICE_URL/v2/status_stream
        deadline: 300.0
      responses:
        '200':
          description: OK

