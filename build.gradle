
buildscript {
  ext.kotlin_version = '1.9.22'

  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.8.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"


  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    mavenLocal()
  }
}

tasks.register('clean', Delete) {
  delete rootProject.buildDir
}
